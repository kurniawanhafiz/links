<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>

  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="./assets/bootstrap/css/bootstrap.min.css">

  <!-- CSS lu -->
  <link rel="stylesheet" href="./assets/css/global.css">

  <!-- Icons -->
  <link rel="stylesheet" href="./assets/bootstrap/bootstrap-icons/bootstrap-icons.css">
</head>

<body class="dark-mode">

<!-- Navbar (biar konsisten sama index) -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      <img src="./assets/img/logo2.jpg" width="32" height="32" class="rounded-circle">
      Kurniawan Hafiz
    </a>
  </div>
</nav>

<!-- 404 Section -->
<section class="hero d-flex align-items-center min-vh-100 text-center">
  <div class="container">

    <!-- Icon -->
    <div class="mb-4">
      <i class="bi bi-exclamation-triangle" style="font-size: 5rem; opacity: .8;"></i>
    </div>

    <!-- 404 Title -->
    <h1 class="display-1 fw-bold text-primary">404</h1>

    <!-- Message -->
    <h3 class="mt-3">Halaman tidak ditemukan</h3>

    <p class="text-muted-custom mt-3 mx-auto" style="max-width:600px;">
      Halaman yang kamu cari mungkin sudah dipindahkan, dihapus,
      atau URL yang dimasukkan salah.
    </p>

    <!-- Buttons -->
    <div class="mt-5">
      <a href="/" class="btn btn-primary btn-cta btn-lg me-2 mt-2">
        <i class="bi bi-house"></i> Kembali ke Home
      </a>

      <button onclick="history.back()" class="btn btn-outline-custom btn-lg mt-2">
        <i class="bi bi-arrow-left"></i> Halaman Sebelumnya
      </button>
    </div>

  </div>
</section>

<script src="./assets/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/theme.js"></script>

</body>
</html>
